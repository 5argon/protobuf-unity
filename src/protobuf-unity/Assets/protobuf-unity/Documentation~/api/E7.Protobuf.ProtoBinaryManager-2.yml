  name: ProtoBinaryManager<PROTO, SELF>
  nameWithType: ProtoBinaryManager<PROTO, SELF>
  fullName: E7.Protobuf.ProtoBinaryManager<PROTO, SELF>
  type: Class
  assemblies:
  - E7.ProtobufUnity
  namespace: E7.Protobuf
  summary: This is a manager for dealing with local save file designed from Protobuf.
  remarks: >-
    However You can use it with just about any protobuf generated class that you want to write it to the disk.

    But in the documentation I will refer to your proto data as "save file".


    As you know protobuf generates a C# class with `partial`,

    this manager connects to that loosely via type params and interface, 

    no subclassing from that actual `partial` data class required.

    Instead you subclass a specialized manager from this `abstract` class.


    Tips : If you name your class as `LocalSave`, then you will be able to nicely type

    `LocalSave.Save()` or `LocalSave.Manager` and do things.


    **Active save** : an *in-memory* save *data* game is using via <xref href="E7.Protobuf.ProtoBinaryManager%602.Active" data-throw-if-not-resolved="false"></xref>.

    <xref href="E7.Protobuf.ProtoBinaryManager%602.Active" data-throw-if-not-resolved="false"></xref> loads a default save from disk called "main save file", or use a cached one if loaded already.


    **Main save file** : a save *file* stored on *disk* with name <xref href="E7.Protobuf.ProtoBinaryManager%602.MainFileName" data-throw-if-not-resolved="false"></xref>.

    Your active save became this file via <xref href="E7.Protobuf.ProtoBinaryManager%602.Save" data-throw-if-not-resolved="false"></xref>,


    You could get a <code class="typeparamref">PROTO</code> from elsewhere

    and use <xref href="E7.Protobuf.ProtoBinaryManager%602.ApplyToActive(%600)" data-throw-if-not-resolved="false"></xref> to set it as active.


    Nowadays games are mostly single-save and autosaved, so it is convenient to keep overwriting the same file by default.

    Many methods in this class was designed to deal with the active slot.
  example: []
  syntax:
    content: 'public abstract class ProtoBinaryManager<PROTO, SELF> where PROTO : IMessage<PROTO>, new() where SELF : ProtoBinaryManager<PROTO, SELF>, new()'
    typeParameters:
    - id: PROTO
      description: The type of your protobuf generated class.
    - id: SELF
      description: >-
        Throw the name of your manager subclass itself into this type param
            for `static` magic <xref href="E7.Protobuf.ProtoBinaryManager%602.Active" data-throw-if-not-resolved="false"></xref> and <xref href="E7.Protobuf.ProtoBinaryManager%602.Manager" data-throw-if-not-resolved="false"></xref> to happen.
    content.vb: Public MustInherit Class ProtoBinaryManager(Of PROTO As {IMessage(Of PROTO), New}, SELF As {ProtoBinaryManager(Of PROTO, SELF), New})
  inheritance:
  - System.Object
  nameWithType.vb: ProtoBinaryManager(Of PROTO, SELF)
  fullName.vb: E7.Protobuf.ProtoBinaryManager(Of PROTO, SELF)
  name.vb: ProtoBinaryManager(Of PROTO, SELF)
