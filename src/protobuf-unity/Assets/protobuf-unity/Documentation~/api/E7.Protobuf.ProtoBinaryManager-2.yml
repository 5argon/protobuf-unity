- uid: E7.Protobuf.ProtoBinaryManager`2.EncryptionPassword
  commentId: P:E7.Protobuf.ProtoBinaryManager`2.EncryptionPassword
  id: EncryptionPassword
  parent: E7.Protobuf.ProtoBinaryManager`2
  langs:
  - csharp
  - vb
  name: EncryptionPassword
  nameWithType: ProtoBinaryManager<PROTO, SELF>.EncryptionPassword
  fullName: E7.Protobuf.ProtoBinaryManager<PROTO, SELF>.EncryptionPassword
  type: Property
  assemblies:
  - E7.ProtobufUnity
  namespace: E7.Protobuf
  summary: >-
    A password string to derive into key,

    for AES encoding in <xref href="E7.Protobuf.ProtoBinaryManager%602.FromStream(System.IO.Stream)" data-throw-if-not-resolved="false"></xref> and <xref href="E7.Protobuf.ProtoBinaryManager%602.ToStream(%600)" data-throw-if-not-resolved="false"></xref>,
  remarks: >-
    This is a getter property, if your game is completely client-side you can choose your own poison, for example : 

    - Hard code it (e.g. `=> "My password is easily disassembled"`)

    - Load it from an another static code, which is obfuscated.

    - Make unmanaged call to non-C# code or DLL and get your stuff.


    Protobuf encoding is not an encryption, the bit patterns are documented [here](https://developers.google.com/protocol-buffers/docs/encoding)


    Also you could override both <xref href="E7.Protobuf.ProtoBinaryManager%602.FromStream(System.IO.Stream)" data-throw-if-not-resolved="false"></xref> and <xref href="E7.Protobuf.ProtoBinaryManager%602.ToStream(%600)" data-throw-if-not-resolved="false"></xref>

    and provide your own algorithm.
  example: []
  syntax:
    content: protected abstract string EncryptionPassword { get; }
    parameters: []
    return:
      type: System.String
    content.vb: Protected MustOverride ReadOnly Property EncryptionPassword As String
  overload: E7.Protobuf.ProtoBinaryManager`2.EncryptionPassword*
  nameWithType.vb: ProtoBinaryManager(Of PROTO, SELF).EncryptionPassword
  fullName.vb: E7.Protobuf.ProtoBinaryManager(Of PROTO, SELF).EncryptionPassword
- uid: E7.Protobuf.ProtoBinaryManager`2.EncryptionSalt
  commentId: P:E7.Protobuf.ProtoBinaryManager`2.EncryptionSalt
  id: EncryptionSalt
  parent: E7.Protobuf.ProtoBinaryManager`2
  langs:
  - csharp
  - vb
  name: EncryptionSalt
  nameWithType: ProtoBinaryManager<PROTO, SELF>.EncryptionSalt
  fullName: E7.Protobuf.ProtoBinaryManager<PROTO, SELF>.EncryptionSalt
  type: Property
  assemblies:
  - E7.ProtobufUnity
  namespace: E7.Protobuf
  summary: >-
    A salt string to derive into key,

    for AES encoding in <xref href="E7.Protobuf.ProtoBinaryManager%602.FromStream(System.IO.Stream)" data-throw-if-not-resolved="false"></xref> and <xref href="E7.Protobuf.ProtoBinaryManager%602.ToStream(%600)" data-throw-if-not-resolved="false"></xref>,
  remarks: >-
    Note that usually salt should be regenerated and provided together with the cipher text.

    The default implementation uses fixed salt without providing the salt along with the encrypted data,

    so it kind of defeat the purpose other than making the KDF work.


    If you want to do it properly, when you override those then you can use this property as generated salt 

    then paste the salt along with the data.
  example: []
  syntax:
    content: protected abstract string EncryptionSalt { get; }
    parameters: []
    return:
      type: System.String
    content.vb: Protected MustOverride ReadOnly Property EncryptionSalt As String
  overload: E7.Protobuf.ProtoBinaryManager`2.EncryptionSalt*
  nameWithType.vb: ProtoBinaryManager(Of PROTO, SELF).EncryptionSalt
  fullName.vb: E7.Protobuf.ProtoBinaryManager(Of PROTO, SELF).EncryptionSalt
