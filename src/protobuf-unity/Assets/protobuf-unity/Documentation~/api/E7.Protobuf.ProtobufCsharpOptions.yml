  fullName: E7.Protobuf.ProtobufCsharpOptions
  type: Class
  assemblies:
  - E7.ProtobufUnity.Editor
  namespace: E7.Protobuf
  summary: >-
    Per-folder override of the C# output options (protoc <code>--csharp_opt</code>).

    Place this asset in a folder to make every <code>.proto</code> in that folder — and its

    subfolders, until a deeper override is found — compile with these options instead of

    the global defaults in Preferences &gt; Protobuf. Each <code>.proto</code> is a separate protoc

    run, so different folders can generate with different options.

    https://protobuf.dev/reference/csharp/csharp-generated/#compiler_options
  example: []
  syntax:
    content: >-
      [CreateAssetMenu(fileName = "ProtobufCsharpOptions", menuName = "Protobuf Unity/C# Output Options (per folder)")]

      public class ProtobufCsharpOptions : ScriptableObject
    content.vb: >-
      <CreateAssetMenu(fileName:="ProtobufCsharpOptions", menuName:="Protobuf Unity/C# Output Options (per folder)")>

      Public Class ProtobufCsharpOptions Inherits ScriptableObject
